<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sân Khấu & Đặt Vé | Ve'ryGood</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Unbounded:wght@600;700;800&family=Space+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="assets/test.png">
    <style>
        body {
            background: var(--bg-dark);
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 40px 20px;
            box-sizing: border-box;
            overflow-y: auto;
            font-family: 'Be Vietnam Pro', sans-serif;
        }

        .booking-page-container {
            width: 95%;
            max-width: 1200px;
            background: rgba(20, 25, 40, 0.85);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 24px;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(25px);
            z-index: 10;
            position: relative;
            display: grid;
            grid-template-columns: 1fr 380px;
            overflow: hidden;
        }

        /* Vùng bản đồ sân khấu tĩnh */
        .stage-map {
            padding: 30px;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(0,0,0,0.2);
            overflow-y: auto;
            max-height: 85vh;
        }

        .stage-box {
            width: 80%;
            height: 100px;
            background: linear-gradient(90deg, var(--primary-purple), var(--primary-cyan));
            border-radius: 10px;
            transform: perspective(600px) rotateX(20deg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Unbounded', sans-serif;
            font-size: 1.5rem;
            margin-bottom: 50px;
            box-shadow: 0 20px 50px rgba(0, 243, 255, 0.3);
            letter-spacing: 5px;
        }

        .zone-mock {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
        }

        .zone-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            font-size: 0.9rem;
            color: #a0a5b5;
            transition: all 0.3s;
        }
        
        .zone-card.selected {
            border-color: var(--primary-cyan);
            background: rgba(0, 243, 255, 0.1);
            color: var(--primary-cyan);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
        }

        /* Lưới ghế ngồi */
        .seat-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 10px;
            margin-top: 20px;
            width: 100%;
        }

        .seat {
            width: 30px;
            height: 30px;
            background: #fff;
            border-radius: 5px 5px 0 0;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            color: #000;
            font-weight: bold;
        }

        .seat.available {
            background: #a0a5b5;
        }

        .seat.selected {
            background: var(--primary-cyan);
            box-shadow: 0 0 10px var(--primary-cyan);
            color: #000;
        }

        .seat.locked {
            background: #ffcc00; /* Vàng = Đang giữ */
            cursor: not-allowed;
        }

        .seat.sold {
            background: #ff4d4d; /* Đỏ = Đã bán */
            cursor: not-allowed;
            opacity: 0.5;
        }
        
        .timer-box {
            background: rgba(255, 204, 0, 0.2);
            border: 1px solid #ffcc00;
            color: #ffcc00;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            font-family: 'Space Mono', monospace;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            display: none;
        }
        .booking-details {
            padding: 30px;
            display: flex;
            flex-direction: column;
            background: rgba(255,255,255,0.02);
            overflow-y: auto;
            max-height: 85vh;
        }

        .booking-title {
            font-family: 'Unbounded', sans-serif;
            font-size: 1.8rem;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #fff, var(--primary-cyan));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .tier-label {
            display: inline-block;
            background: rgba(188, 0, 255, 0.2);
            border: 1px solid var(--primary-purple);
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: #eab8ff;
            margin-bottom: 30px;
            width: fit-content;
        }

        .booking-box {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .booking-box h3 {
            font-size: 0.9rem;
            color: #a0a5b5;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 12px 15px;
            border-radius: 10px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-input:focus {
            border-color: var(--primary-cyan);
        }

        .price-total-box {
            margin-top: auto;
            padding-top: 20px;
            border-top: 1px dashed rgba(255, 255, 255, 0.1);
        }

        .price-total-label {
            color: #a0a5b5;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .price-total-value {
            font-family: 'Unbounded', sans-serif;
            font-size: 1.8rem;
            color: var(--primary-cyan);
        }

        .checkout-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(90deg, var(--primary-purple), var(--primary-cyan));
            border: none;
            border-radius: 15px;
            color: white;
            font-weight: bold;
            font-family: 'Unbounded', sans-serif;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .checkout-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 243, 255, 0.4);
        }

        .checkout-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .back-home {
            position: absolute;
            top: 25px;
            left: 30px;
            color: #a0a5b5;
            text-decoration: none;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: color 0.3s;
        }
        
        .back-home:hover { color: var(--primary-cyan); }

        .wallet-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: rgba(0, 243, 255, 0.05);
            border: 1px solid rgba(0, 243, 255, 0.2);
            border-radius: 10px;
            margin-top: 10px;
        }

        /* Giao diện mua vé không sơ đồ */
        .non-map-container {
            width: 100%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .tier-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s;
        }

        .tier-item:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(0, 243, 255, 0.3);
        }

        .tier-info h4 {
            font-family: 'Unbounded', sans-serif;
            font-size: 1.1rem;
            margin: 0 0 5px 0;
            color: #fff;
        }

        .tier-info .price {
            color: var(--primary-cyan);
            font-weight: 600;
            font-size: 1rem;
        }

        .qty-selector {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(0, 0, 0, 0.3);
            padding: 5px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .qty-btn {
            width: 35px;
            height: 35px;
            border-radius: 8px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .qty-btn:hover:not(:disabled) {
            background: var(--primary-cyan);
            color: #000;
        }

        .qty-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .qty-value {
            font-family: 'Space Mono', monospace;
            font-size: 1.2rem;
            font-weight: bold;
            min-width: 30px;
            text-align: center;
        }

        @media (max-width: 850px) {
            .booking-page-container { grid-template-columns: 1fr; max-height: none; }
            .stage-map { border-right: none; border-bottom: 1px solid rgba(255,255,255,0.1); }
        }
    </style>
</head>
<body>
    <div class="custom-cursor"></div>
    <div class="bg-mesh primary-mesh"></div>
    <div class="bg-mesh secondary-mesh"></div>

    <a href="#" onclick="window.history.back(); return false;" class="back-home"><i class="fa fa-arrow-left"></i> Quay lại</a>

    <div class="booking-page-container">
        <div class="stage-map">
            <div id="stageZoneList" class="zone-mock">
                <!-- Khu vực sẽ được JS render -->
                <p style="grid-column: 1/-1; color: #a0a5b5; text-align: center;">Đang tải sơ đồ...</p>
            </div>
            
            <!-- Vùng hiển thị Canvas Sơ đồ (ẩn mặc định) -->
            <div id="canvasWrapper" style="display: none; width: 100%; max-height: 450px; overflow: auto; position: relative; margin-bottom: 20px; background: rgba(0,0,0,0.5); border-radius: 12px; border: 1px solid rgba(0,243,255,0.2); scrollbar-width: thin;">
                <canvas id="readOnlyStage"></canvas>
            </div>
            
            <!-- Vùng hiển thị mua vé không sơ đồ (ẩn mặc định) -->
            <div id="nonMapBookingUI" class="non-map-container" style="display: none;">
                <!-- Sẽ được JS render -->
            </div>
            
            <div class="seat-grid" id="seatGrid" style="width: 100%; margin-top: 40px; justify-items: center;">
                <!-- Ghế được JS render -->
            </div>
        </div>

        <!-- Cột Phải: Thông tin đặt vé -->
        <div class="booking-details">
            <h1 class="booking-title">ĐẶT VÉ</h1>
            <div class="tier-label" id="lblTierName">Đang tải...</div>

            <div class="booking-box" id="zoneSelectBox">
                <h3><i class="fa fa-map-marked-alt"></i> KHU VỰC ĐANG CHỌN</h3>
                <div id="selectedZoneName" style="font-weight: bold; color: var(--primary-cyan); margin-bottom: 10px;">Chưa chọn</div>
            </div>

            <div class="booking-box" id="quantityBox">
                <h3><i class="fa fa-ticket-alt"></i> SỐ LƯỢNG VÉ</h3>
                
                <!-- Giao diện tăng giảm cho khu vực đứng (ẩn mặc định) -->
                <div id="manualQtySelector" style="display: none; margin-bottom: 15px; background: rgba(0, 243, 255, 0.05); padding: 15px; border-radius: 12px; border: 1px solid rgba(0, 243, 255, 0.2);">
                    <div class="qty-selector" style="justify-content: center;">
                        <button class="qty-btn" onclick="changeStandingQty(-1)">-</button>
                        <div class="qty-value" id="manualQtyValue" style="min-width: 40px; text-align: center; font-size: 1.4rem;">0</div>
                        <button class="qty-btn" onclick="changeStandingQty(1)">+</button>
                    </div>
                    <div style="font-size: 0.7rem; color: var(--primary-cyan); text-align: center; margin-top: 8px; text-transform: uppercase; letter-spacing: 1px;">Khu vực đứng</div>
                </div>

                <input type="number" id="ticketQuantity" value="0" readonly class="form-input" style="text-align: center; font-family: 'Space Mono', monospace; font-size: 1.5rem; font-weight: bold; color: var(--primary-cyan);">
                <div id="qtyNote" style="font-size: 0.75rem; color: #a0a5b5; margin-top: 8px; text-align: center;">(Click chọn trên sơ đồ)</div>
            </div>

            <div class="booking-box" id="discountBox">
                <h3><i class="fa fa-percentage"></i> MÃ GIẢM GIÁ</h3>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="discountCodeInput" placeholder="Nhập mã..." class="form-input" style="flex: 1; text-transform: uppercase;">
                    <button class="btn btn-outline" onclick="applyDiscountCode()" style="padding: 10px 15px; border-radius: 10px; border-color: var(--primary-cyan); color: var(--primary-cyan);">Áp dụng</button>
                </div>
                <div id="discountInfo" style="font-size: 0.8rem; margin-top: 8px; display: none;"></div>
            </div>

            <div class="timer-box" id="lockTimer">
                10:00
            </div>

            <div class="booking-box" style="border-color: rgba(0, 243, 255, 0.3);">
                <h3><i class="fa fa-credit-card"></i> PHƯƠNG THỨC THANH TOÁN</h3>
                <select id="paymentMethodSelect" class="form-input" style="margin-bottom: 15px;" onchange="toggleWalletInfo()">
                    <option value="WALLET">Ví cá nhân (Ve'ryGood Pay)</option>
                    <option value="MOMO">Ví MoMo (Giả lập)</option>
                    <option value="BANK">Thẻ Ngân hàng / VNPAY (Giả lập)</option>
                </select>
                <div class="wallet-info" id="walletInfoBox" style="flex-direction: column; align-items: flex-start; gap: 10px;">
                    <div style="display: flex; justify-content: space-between; width: 100%;">
                        <span style="color: #a0a5b5; font-size: 0.85rem;">SỐ DƯ HIỆN TẠI:</span>
                        <span id="userWalletBalance" style="font-family: 'Space Mono', monospace; font-weight: bold; color: var(--primary-cyan);">--- VNĐ</span>
                    </div>
                    <div style="width: 100%;">
                        <span style="color: #a0a5b5; font-size: 0.85rem; display: block; margin-bottom: 5px;">MẬT KHẨU THANH TOÁN:</span>
                        <input type="password" id="walletPasswordInput" class="form-input" placeholder="Nhập mật khẩu ví..." style="padding: 10px; width: 100%;" value="123456" />
                    </div>
                </div>
            </div>

            <div class="price-total-box">
                <div class="price-total-label">TỔNG CỘNG THANH TOÁN</div>
                <div class="price-total-value" id="lblTotalPrice">0 VNĐ</div>
                <button class="checkout-btn" id="confirmBookingBtn" onclick="submitBooking()">
                    XÁC NHẬN ĐẶT VÉ <i class="fa fa-chevron-right"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        function toggleWalletInfo() {
            const method = document.getElementById('paymentMethodSelect').value;
            const walletBox = document.getElementById('walletInfoBox');
            if (method === 'WALLET') {
                walletBox.style.display = 'flex';
            } else {
                walletBox.style.display = 'none';
            }
        }

        // Custom cursor logic
        const cursor = document.querySelector('.custom-cursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        // URL Parameters
        const urlParams = new URLSearchParams(window.location.search);
        const eventId = urlParams.get('eventId');
        const tierId = urlParams.get('tierId');
        const tierName = urlParams.get('tierName');
        const scheduleId = urlParams.get('scheduleId'); // Thêm mã suất diễn


        let unitPrice = 0;
        let userBalance = 0;
        let eventZones = []; // Lưu tất cả khu vực của sự kiện
        let zonePriceMap = {}; // Lưu giá tiền theo mã khu vực
        let eventTiers = []; // Lưu danh sách hạng vé
        let nonMapQuantities = {}; // { tierId: quantity }
        let isMapAvailable = false;
        let zoneSeatCounts = {}; // { zoneId: count }
        let selectedStandingQty = 0;
        let currentSelectedZoneId = null;
        let appliedDiscount = { code: '', amount: 0, type: '', value: 0, max: 0 };

        document.getElementById('lblTierName').innerText = tierName ? `Hạng: ${tierName}` : "Hạng vé";

        async function initData() {
            const token = localStorage.getItem('stellar_token');
            if(!token) {
                alert("Vui lòng đăng nhập để tiếp tục!");
                window.location.href = 'auth.html';
                return;
            }

            try {
                // 1. Lấy thông tin Ví
                const profRes = await fetch('http://localhost:8081/api/user/profile', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (profRes.ok) {
                    const profile = await profRes.json();
                    userBalance = profile.walletBalance || 0;
                    document.getElementById('userWalletBalance').innerText = userBalance.toLocaleString('vi-VN') + " VNĐ";
                } else if (profRes.status === 401 || profRes.status === 403) {
                    // Token hết hạn hoặc không hợp lệ
                    localStorage.removeItem('stellar_token');
                    alert("Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại!");
                    window.location.href = 'auth.html';
                    return;
                } else {
                    document.getElementById('userWalletBalance').innerText = "Lỗi tải số dư";
                }

                // 2. Lấy thông tin Sự kiện & Khu vực
                const response = await fetch(`http://localhost:8081/api/events/${eventId}`);
                if (!response.ok) throw new Error(`Sự kiện không tồn tại (HTTP ${response.status})`);
                const ev = await response.json();
                
                if (ev.status === 'Đã kết thúc') {
                    alert("Sự kiện này đã kết thúc, bạn không thể mua vé nữa nha! 😢");
                    window.location.href = 'index.html';
                    return;
                }
                
                // Thu thập tất cả khu vực của sự kiện và giá tiền tương ứng
                eventZones = [];
                zonePriceMap = {};
                const tiers = ev.ticketTiers || [];
                eventTiers = tiers;
                if (tiers.length > 0) {
                    tiers.forEach(tier => {
                        const tId = tier.id || tier.maHangVe; 
                        if (tier.khuVucList) {
                            tier.khuVucList.forEach(kv => {
                                kv.tierId = tId; 
                                eventZones.push(kv);
                                zonePriceMap[kv.id || kv.maKhuVuc] = tier.price || tier.giaNiemYet;
                            });
                        }
                    });
                }

                // Tìm hạng vé khớp với tierId từ URL param (null-safe)
                let activeTierId = tierId;
                const matchedTier = activeTierId ? tiers.find(t => (t.id || t.maHangVe) == activeTierId) : null;
                
                if (matchedTier) {
                    unitPrice = matchedTier.price || matchedTier.giaNiemYet;
                    document.getElementById('lblTierName').innerText = `Hạng: ${matchedTier.name || matchedTier.tenHangVe}`;
                    renderZones(matchedTier.khuVucList);
                } else if (tiers.length > 0) {
                    // Fallback: dùng hạng vé đầu tiên
                    const firstTier = tiers[0];
                    activeTierId = firstTier.id || firstTier.maHangVe;
                    unitPrice = firstTier.price || firstTier.giaNiemYet;
                    document.getElementById('lblTierName').innerText = `Hạng: ${firstTier.name || firstTier.tenHangVe}`;
                    renderZones(firstTier.khuVucList);
                }
                updateUIPrice();
                
                // 3. Tải Sơ đồ sân khấu (nếu có)
                try {
                    const smRes = await fetch(`http://localhost:8081/api/events/${eventId}/seatmap`);
                    let hasCanvas = false;
                    if (smRes.ok) {
                        const smData = await smRes.json();
                        if (smData && smData.duLieuCanvas && smData.duLieuCanvas.length > 50) {
                            hasCanvas = true;
                            isMapAvailable = true;
                            
                            // Ẩn sơ đồ mặc định khi đã có sơ đồ vẽ tay
                            document.getElementById('stageZoneList').style.display = 'none';
                            document.getElementById('seatGrid').style.display = 'none';
                            document.getElementById('nonMapBookingUI').style.display = 'none';

                            const cw = document.getElementById('canvasWrapper');
                            cw.style.display = 'block';

                            // Chờ browser reflow để clientWidth có giá trị đúng
                            await new Promise(resolve => requestAnimationFrame(resolve));

                            const canvasWidth = cw.clientWidth > 0 ? cw.clientWidth : 800;
                            const scale = (canvasWidth - 40) / 1000;

                            const canvas = new fabric.Canvas('readOnlyStage', {
                                selection: false,
                                defaultCursor: 'default'
                            });
                            window.bookingCanvas = canvas;
                            
                            canvas.setWidth(1000 * scale);
                            canvas.setHeight(800 * scale);
                            canvas.setZoom(scale);

                            canvas.on('mouse:up', function(opt) {
                                if (!opt.target) return;
                                let target = opt.target;
                                if (target.shapeType === 'SEAT') {
                                    if (target.seatStatus === 'sold' || target.seatStatus === 'locked') {
                                        alert('Ghế này đã được đặt hoặc đang được người khác giữ.');
                                        return;
                                    }
                                    if (target.zoneId !== undefined && target.zoneId !== null) {
                                        selectZone(target.zoneId); // Đồng bộ khu vực khi chọn ghế
                                    }
                                    toggleSeatCanvas(target);
                                    return;
                                }
                                if (target.zoneId !== undefined && target.zoneId !== null && target.zoneId !== '') {
                                    selectZone(target.zoneId);
                                    canvas.getObjects().forEach(o => {
                                        if (o.zoneId && o.shapeType !== 'SEAT') {
                                            o.set('strokeWidth', String(o.zoneId) === String(target.zoneId) ? 4 : 2);
                                            o.set('stroke', String(o.zoneId) === String(target.zoneId) ? '#00f3ff' : '#ffffff');
                                        }
                                    });
                                    canvas.renderAll();
                                }
                            });
                            
                            canvas.loadFromJSON(smData.duLieuCanvas, function() {
                                canvas.getObjects().forEach(obj => {
                                    obj.set({
                                        selectable: false,
                                        hasControls: false,
                                        hasBorders: false,
                                        lockMovementX: true,
                                        lockMovementY: true,
                                        lockRotation: true,
                                        lockScalingX: true,
                                        lockScalingY: true
                                    });
                                    if (obj.stroke === '#ffffff11') {
                                        canvas.sendToBack(obj);
                                        obj.set('evented', false);
                                    } else if (obj.shapeType === 'SEAT') {
                                        obj.set({ evented: true, opacity: 1, hoverCursor: 'pointer' });
                                    } else if (obj.zoneId) {
                                        obj.set({ evented: true, opacity: 0.4, hoverCursor: 'pointer' });
                                    } else {
                                        obj.set({ evented: false, opacity: 0.6 });
                                    }
                                });
                                canvas.renderAll();
                                loadCanvasSeatsStatus();
                            });
                        }
                    }
                    
                    if (!hasCanvas) {
                        // Nếu không có sơ đồ vẽ tay, hiển thị sơ đồ mặc định (danh sách khu vực)
                        document.getElementById('stageZoneList').style.display = 'grid';
                        document.getElementById('canvasWrapper').style.display = 'none';
                        document.getElementById('seatGrid').style.display = 'grid';
                        document.getElementById('nonMapBookingUI').style.display = 'none';
                        isMapAvailable = false;
                        
                        // Kiểm tra nếu không có bất kỳ khu vực nào, hiển thị UI mua vé đơn giản
                        if (!eventZones || eventZones.length === 0) {
                            document.getElementById('stageZoneList').style.display = 'none';
                            document.getElementById('nonMapBookingUI').style.display = 'flex';
                            renderNonMapTiers(ev ? ev.ticketTiers : []);
                        }
                    }

                } catch(e) { 
                    console.warn('Không tải được sơ đồ từ server:', e.message); 
                    document.getElementById('nonMapBookingUI').style.display = 'flex';
                    renderNonMapTiers(ev ? ev.ticketTiers : []);
                }

            } catch(e) {
                console.error("Lỗi khởi tạo:", e);
                document.getElementById('userWalletBalance').innerText = "Lỗi kết nối";
            }
        }

        function changeNonMapQty(tierId, delta) {
            const current = nonMapQuantities[tierId] || 0;
            
            // Tìm thông tin hạng vé hiện tại để check số vé còn lại
            const tierInfo = eventTiers.find(t => t.id == tierId);
            const maxAvailable = (tierInfo && tierInfo.soVeConLai !== undefined) ? tierInfo.soVeConLai : 10;
            
            const newVal = Math.max(0, Math.min(Math.min(10, maxAvailable), current + delta));
            
            // Nếu muốn giới hạn tổng số vé là 10
            const totalQty = Object.values(nonMapQuantities).reduce((a, b) => a + b, 0);
            if (delta > 0 && totalQty >= 10) {
                alert("Bạn chỉ được chọn tối đa 10 vé!");
                return;
            }
            if (delta > 0 && current >= maxAvailable) {
                alert("Số lượng vé còn lại không đủ!");
                return;
            }

            nonMapQuantities[tierId] = newVal;
            
            // Cập nhật UI ngay lập tức
            const el = document.getElementById(`qty-${tierId}`);
            if (el) el.innerText = newVal;
            
            // Cập nhật nút bấm
            renderNonMapTiers(eventTiers);
            updateUIPrice();
        }

        function syncZoneSelection() {
            // Keep this for compatibility if zoneSelect changes programmatically
            const val = document.getElementById('zoneSelect') ? document.getElementById('zoneSelect').value : null;
            if (val) selectZone(val);
        }

        function selectZone(zoneId) {
            if (!zoneId) return;
            console.log("Selecting Zone ID:", zoneId);
            
            currentSelectedZoneId = zoneId;
            // So sánh dưới dạng chuỗi để đảm bảo khớp (đề phòng kiểu dữ liệu khác nhau)
            const zoneData = eventZones.find(z => String(z.id || z.maKhuVuc) === String(zoneId));
            const nameEl = document.getElementById('selectedZoneName');
            
            if (zoneData) {
                console.log("Zone found:", zoneData.name);
                if (nameEl) nameEl.innerText = zoneData.name;
                
                // Cập nhật nhãn hạng vé dựa trên khu vực đang chọn
                const tier = eventTiers.find(t => String(t.id || t.maHangVe) === String(zoneData.tierId));
                if (tier) {
                    console.log("Tier found:", tier.name);
                    document.getElementById('lblTierName').innerText = `Hạng: ${tier.name}`;
                    unitPrice = tier.price; // Cập nhật giá đơn vị để tính toán chính xác
                }
            } else {
                console.warn("Zone not found for ID:", zoneId);
                if (nameEl) nameEl.innerText = "Chưa chọn";
            }

            // Cập nhật UI card
            document.querySelectorAll('.zone-card').forEach(card => {
                if (card.dataset.zone === zoneId) {
                    card.classList.add('selected');
                } else {
                    card.classList.remove('selected');
                }
            });

            // Kiểm tra xem khu vực này là khu vực đứng hay ngồi
            const seatCount = zoneSeatCounts[zoneId] || 0;
            const manualSelector = document.getElementById('manualQtySelector');
            const qtyNote = document.getElementById('qtyNote');
            
            if (seatCount === 0 && manualSelector) {
                manualSelector.style.display = 'block';
                if (qtyNote) qtyNote.innerText = "(Điều chỉnh số lượng ở trên)";
                
                selectedStandingQty = nonMapQuantities[zoneId] || 0;
                const manualQtyValEl = document.getElementById('manualQtyValue');
                if (manualQtyValEl) manualQtyValEl.innerText = selectedStandingQty;
            } else if (manualSelector) {
                manualSelector.style.display = 'none';
                if (qtyNote) qtyNote.innerText = "(Click chọn trên sơ đồ)";
            }
            
            updateUIPrice();
        }

        function changeStandingQty(delta) {
            if (!currentSelectedZoneId) return;
            
            const currentQty = nonMapQuantities[currentSelectedZoneId] || 0;
            const newVal = Math.max(0, Math.min(10, currentQty + delta));
            
            // Giới hạn tổng 10 vé
            const { qty: currentTotalQty } = updateUIPrice();
            if (delta > 0 && currentTotalQty >= 10) {
                alert("Tổng số vé tối đa là 10!");
                return;
            }

            selectedStandingQty = newVal;
            nonMapQuantities[currentSelectedZoneId] = newVal;
            
            const manualQtyValEl = document.getElementById('manualQtyValue');
            if (manualQtyValEl) manualQtyValEl.innerText = newVal;
            updateUIPrice();
        }

        let selectedSeats = [];
        let isHolding = false;
        let countdownInterval;

        let seatStatusMap = new Map();

        async function loadCanvasSeatsStatus() {
            if (!window.bookingCanvas) return;
            const grid = document.getElementById('seatGrid');
            grid.style.display = 'none'; // Ẩn lưới cũ
            
            // Đếm số ghế theo từng khu vực trên canvas
            zoneSeatCounts = {};
            window.bookingCanvas.getObjects().forEach(obj => {
                if (obj.shapeType === 'SEAT' && obj.zoneId) {
                    zoneSeatCounts[obj.zoneId] = (zoneSeatCounts[obj.zoneId] || 0) + 1;
                }
            });

            updateUIPrice();

            const token = localStorage.getItem('stellar_token');
            const currentUser = localStorage.getItem('stellar_user');
            
            let maLichDien = scheduleId;
            if (!maLichDien || maLichDien === "undefined" || isNaN(parseInt(maLichDien))) {
                maLichDien = eventId;
            }

            // Lấy trạng thái cho TẤT CẢ các khu vực của sự kiện
            for (let kv of eventZones) {
                try {
                    let res = await fetch(`http://localhost:8081/api/seats/status/${kv.id}/${maLichDien}`, {
                        headers: { 'Authorization': 'Bearer ' + token }
                    });
                    if (res.ok) {
                        let seats = await res.json();
                        seats.forEach(s => {
                            seatStatusMap.set(kv.id + '_' + s.toaDo, s);
                        });
                    }
                } catch(e) {}
            }

            // Cập nhật lên Canvas
            window.bookingCanvas.getObjects().forEach(obj => {
                if (obj.shapeType === 'SEAT') {
                    let key = obj.zoneId + '_' + obj.customLabel;
                    let seatData = seatStatusMap.get(key);
                    
                    if (seatData) {
                        obj.set('dbSeatId', seatData.maGhe);
                        
                        let isMySeatLocally = selectedSeats.includes(seatData.maGhe.toString()) || selectedSeats.includes(seatData.maGhe);
                        let isMySeatOnServer = (seatData.giuBoi && currentUser && seatData.giuBoi === currentUser);
                        let isMySeat = isMySeatLocally || isMySeatOnServer;
                        
                        let circle = obj.getObjects()[0]; 
                        
                        if (!obj.originalColor) obj.set('originalColor', circle.fill);
                        
                        if (seatData.trangThai === 'Đã đặt') {
                            circle.set('fill', '#444444');
                            obj.set('seatStatus', 'sold');
                        } else if (seatData.trangThai === 'Đang giữ chỗ') {
                            if (isMySeat) {
                                circle.set('fill', '#00f3ff');
                                obj.set('seatStatus', 'selected');
                                if (!isMySeatLocally) selectedSeats.push(seatData.maGhe.toString());
                            } else {
                                circle.set('fill', '#ff4d4d');
                                obj.set('seatStatus', 'locked');
                            }
                        } else if (isMySeat) {
                            circle.set('fill', '#00f3ff');
                            obj.set('seatStatus', 'selected');
                        } else {
                            circle.set('fill', obj.originalColor);
                            obj.set('seatStatus', 'available');
                        }
                        
                        obj.set('selectable', false);
                        obj.set('evented', true);
                        obj.set('hasControls', false);
                        obj.set('hasBorders', false);
                        obj.set('lockMovementX', true);
                        obj.set('lockMovementY', true);
                        obj.set('hoverCursor', (obj.seatStatus === 'sold' || obj.seatStatus === 'locked') ? 'not-allowed' : 'pointer');
                    } else {
                        obj.set('opacity', 0.5);
                        obj.set('evented', false);
                    }
                }
            });
            window.bookingCanvas.renderAll();
            updateUIPrice();
        }

        async function toggleSeatCanvas(obj) {
            if (obj.isProcessing) return;
            const seatId = obj.dbSeatId;
            if (!seatId) return;

            // Kiểm tra xem đây là hành động chọn mới hay bỏ chọn
            const isSelecting = obj.seatStatus !== 'selected';
            const actionText = isSelecting ? "đặt" : "hủy đặt";
            
            if (!confirm(`Bạn có chắc chắn muốn ${actionText} ghế ${obj.customLabel || ''} không?`)) {
                return;
            }
            
            const token = localStorage.getItem('stellar_token');
            obj.isProcessing = true;
            let circle = obj.getObjects()[0];
            circle.set('opacity', 0.7);
            window.bookingCanvas.renderAll();

            if (obj.seatStatus === 'selected') {
                // UNLOCK
                try {
                    const validMaLichDien = (scheduleId && scheduleId !== "undefined") ? scheduleId : eventId;
                    const res = await fetch('http://localhost:8081/api/seats/unlock', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                        body: JSON.stringify({ maGhe: parseInt(seatId), maLichDien: parseInt(validMaLichDien) })
                    });
                    
                    if (res.ok) {
                        circle.set('fill', obj.originalColor);
                        obj.set('seatStatus', 'available');
                        selectedSeats = selectedSeats.filter(s => parseInt(s) !== parseInt(seatId));
                        updateUIPrice();
                        
                        if(selectedSeats.length === 0) {
                            clearInterval(countdownInterval);
                            document.getElementById('lockTimer').style.display = 'none';
                        }
                    } else { throw new Error(); }
                } catch(e) {
                    alert("Lỗi nhả ghế.");
                }
            } else {
                // LOCK
                if (selectedSeats.length >= 10) {
                    alert("Chỉ được mua tối đa 10 vé!");
                    obj.isProcessing = false;
                    circle.set('opacity', 1);
                    window.bookingCanvas.renderAll();
                    return;
                }
                
                try {
                    const validMaLichDien = (scheduleId && scheduleId !== "undefined") ? scheduleId : eventId;
                    const res = await fetch('http://localhost:8081/api/seats/lock', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                        body: JSON.stringify({ maGhe: parseInt(seatId), maLichDien: parseInt(validMaLichDien) })
                    });
                    const data = await res.json();
                    
                    if (!res.ok || !data.success) { 
                        alert("Ghế vừa bị người khác chọn!"); 
                        circle.set('fill', '#ff4d4d');
                        obj.set('seatStatus', 'locked');
                        obj.set('hoverCursor', 'not-allowed');
                    } else {
                        circle.set('fill', '#00f3ff');
                        obj.set('seatStatus', 'selected');
                        selectedSeats.push(seatId.toString());
                        updateUIPrice();
                        
                        if(selectedSeats.length === 1) {
                            document.getElementById('lockTimer').style.display = 'block';
                            startTimer(10 * 60);
                        }
                    }
                } catch(e) {
                    alert("Lỗi khóa ghế.");
                }
            }
            
            obj.isProcessing = false;
            circle.set('opacity', 1);
            window.bookingCanvas.renderAll();
        }


        function startTimer(duration) {
            let timer = duration, minutes, seconds;
            const display = document.getElementById('lockTimer');
            clearInterval(countdownInterval);
            
            countdownInterval = setInterval(function () {
                minutes = parseInt(timer / 60, 10);
                seconds = parseInt(timer % 60, 10);

                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                display.textContent = "THỜI GIAN GIỮ CHỖ: " + minutes + ":" + seconds;

                if (--timer < 0) {
                    clearInterval(countdownInterval);
                    display.textContent = "HẾT HẠN GIỮ CHỖ";
                    display.style.color = "#ff4d4d";
                    display.style.borderColor = "#ff4d4d";
                    alert("Đã hết thời gian giữ chỗ! Hệ thống sẽ tải lại sơ đồ ghế.");
                    loadCanvasSeatsStatus();
                    document.getElementById('lockTimer').style.display = 'none';
                }
            }, 1000);
        }

        function updateUIPrice() {
            let total = 0;
            let qty = 0;

            if (isMapAvailable && window.bookingCanvas) {
                // 1. Tính tiền từ ghế đã chọn trên Canvas
                qty = selectedSeats.length;
                const seatObjects = window.bookingCanvas.getObjects().filter(o => o.shapeType === 'SEAT');
                selectedSeats.forEach(sid => {
                    const obj = seatObjects.find(o => o.dbSeatId == sid);
                    if (obj && obj.zoneId && zonePriceMap[obj.zoneId]) {
                        total += zonePriceMap[obj.zoneId];
                    } else {
                        total += unitPrice;
                    }
                });

                // 2. Cộng thêm tiền từ các khu vực đứng (nếu có chọn số lượng)
                Object.keys(nonMapQuantities).forEach(zid => {
                    const q = nonMapQuantities[zid];
                    if (q > 0) {
                        qty += q;
                        total += (q * (zonePriceMap[zid] || unitPrice));
                    }
                });

            } else {
                // Trường hợp KHÔNG có sơ đồ (toàn bộ là đứng)
                Object.keys(nonMapQuantities).forEach(id => {
                    const q = nonMapQuantities[id];
                    if (q > 0) {
                        qty += q;
                        // Kiểm tra ID này là khu vực hay hạng vé
                        const price = zonePriceMap[id] || (eventTiers.find(t => t.id == id)?.price) || unitPrice;
                        total += (q * price);
                    }
                });
            }

            // 3. Áp dụng giảm giá nếu có
            if (appliedDiscount.code) {
                let discountAmt = 0;
                if (appliedDiscount.type === 'Theo phần trăm') {
                    discountAmt = total * (appliedDiscount.value / 100);
                    if (appliedDiscount.max > 0 && discountAmt > appliedDiscount.max) discountAmt = appliedDiscount.max;
                } else {
                    discountAmt = appliedDiscount.value;
                }
                if (discountAmt > total) discountAmt = total;
                appliedDiscount.amount = discountAmt;
                total -= discountAmt;
            }

            document.getElementById('ticketQuantity').value = qty;
            document.getElementById('lblTotalPrice').innerText = total.toLocaleString('vi-VN') + " VNĐ";
            if (appliedDiscount.code) {
                document.getElementById('lblTotalPrice').innerHTML = `
                    <div style="font-size: 0.9rem; text-decoration: line-through; opacity: 0.5;">${(total + appliedDiscount.amount).toLocaleString('vi-VN')} VNĐ</div>
                    <div>${total.toLocaleString('vi-VN')} VNĐ</div>
                `;
            }
            
            const totalEl = document.getElementById('lblTotalPrice');
            if (total > userBalance && qty > 0) {
                totalEl.style.color = '#ff4d4d';
            } else {
                totalEl.style.color = 'var(--primary-cyan)';
            }
            return { total, qty };
        }

        async function applyDiscountCode() {
            const code = document.getElementById('discountCodeInput').value.trim().toUpperCase();
            if (!code) return;

            const infoEl = document.getElementById('discountInfo');
            infoEl.style.display = 'block';
            infoEl.style.color = '#a0a5b5';
            infoEl.innerText = "Đang kiểm tra mã...";

            try {
                const token = localStorage.getItem('stellar_token');
                const res = await fetch('http://localhost:8081/api/promotions/validate', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ code, maSuKien: eventId })
                });

                if (res.ok) {
                    const data = await res.json();
                    appliedDiscount = {
                        code: data.maGiamGia,
                        type: data.loaiGiam,
                        value: data.soLuongGiam,
                        max: data.giamToiDa,
                        amount: 0
                    };
                    infoEl.style.color = '#00ff88';
                    infoEl.innerText = `✅ Đã áp dụng mã ${data.maGiamGia}!`;
                    updateUIPrice();
                } else {
                    const err = await res.json();
                    infoEl.style.color = '#ff4d4d';
                    infoEl.innerText = `❌ ${err.message || 'Mã không hợp lệ'}`;
                    appliedDiscount = { code: '', amount: 0, type: '', value: 0, max: 0 };
                    updateUIPrice();
                }
            } catch (e) {
                infoEl.style.color = '#ff4d4d';
                infoEl.innerText = "❌ Lỗi kết nối server";
            }
        }

        async function submitBooking() {
            const token = localStorage.getItem('stellar_token');
            const { total: totalAmt, qty } = updateUIPrice();
            const paymentMethod = document.getElementById('paymentMethodSelect') ? document.getElementById('paymentMethodSelect').value : 'WALLET';

            if (qty === 0) {
                alert(isMapAvailable ? "Vui lòng chọn ít nhất 1 ghế trên sơ đồ!" : "Vui lòng chọn ít nhất 1 vé!");
                return;
            }
            
            if (paymentMethod === 'WALLET' && totalAmt > userBalance) {
                alert("Số dư trong ví của bạn không đủ!");
                return;
            }

            const btn = document.getElementById('confirmBookingBtn');
            btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> ĐANG XỬ LÝ...';
            btn.disabled = true;

            try {
                const validMaLichDien = (scheduleId && scheduleId !== "undefined") ? scheduleId : eventId;
                
                // Nếu là trường hợp không sơ đồ, có thể có nhiều hạng vé
                // Tuy nhiên Backend hiện tại chỉ hỗ trợ 1 maHangVe mỗi request.
                // Ta sẽ gửi request cho từng hạng vé có số lượng > 0 hoặc báo lỗi nếu chọn nhiều hạng vé.
                // Theo yêu cầu của ảnh, ta cho phép chọn nhiều, vậy ta sẽ lặp qua các hạng vé.
                
                let tiersToBook = {};
                if (isMapAvailable) {
                    // 1. Xử lý ghế ngồi từ Canvas
                    if (window.bookingCanvas) {
                        const seatObjects = window.bookingCanvas.getObjects().filter(o => o.shapeType === 'SEAT');
                        selectedSeats.forEach(sid => {
                            const obj = seatObjects.find(o => o.dbSeatId == sid);
                            if (obj && obj.zoneId) {
                                const zone = eventZones.find(z => String(z.id || z.maKhuVuc) === String(obj.zoneId));
                                let tId = zone ? zone.tierId : (tierId || (eventTiers.length > 0 ? (eventTiers[0].id || eventTiers[0].maHangVe) : null));
                                let zId = zone ? (zone.id || zone.maKhuVuc) : null;
                                if (tId && !tiersToBook[tId]) tiersToBook[tId] = { id: tId, maKhuVuc: zId, qty: 0, seats: [] };
                                if (tId) {
                                    tiersToBook[tId].qty++;
                                    tiersToBook[tId].seats.push(sid);
                                }
                            }
                        });
                    }
                    
                    // 2. Xử lý số lượng vé đứng (nếu có)
                    Object.keys(nonMapQuantities).forEach(zid => {
                        const q = nonMapQuantities[zid];
                        if (q > 0) {
                            const zone = eventZones.find(z => String(z.tierId) === String(zid) || String(z.id || z.maKhuVuc) === String(zid));
                            let tId = zone ? zone.tierId : (tierId || zid);
                            let zId = zone ? (zone.id || zone.maKhuVuc) : null;
                            if (tId && !tiersToBook[tId]) tiersToBook[tId] = { id: tId, maKhuVuc: zId, qty: 0, seats: [] };
                            if (tId) {
                                tiersToBook[tId].qty += q;
                            }
                        }
                    });
                } else {
                    // Trường hợp KHÔNG có sơ đồ (Canvas)
                    Object.keys(nonMapQuantities).forEach(zid => {
                        const q = nonMapQuantities[zid];
                        if (q > 0) {
                            const zone = eventZones.find(z => String(z.tierId) === String(zid) || String(z.id || z.maKhuVuc) === String(zid));
                            let tId = zone ? zone.tierId : (tierId || zid);
                            let zId = zone ? (zone.id || zone.maKhuVuc) : null;
                            if (tId && !tiersToBook[tId]) tiersToBook[tId] = { id: tId, maKhuVuc: zId, qty: 0, seats: [] };
                            if (tId) {
                                tiersToBook[tId].qty += q;
                            }
                        }
                    });
                }

                const bookingList = Object.values(tiersToBook);
                if (bookingList.length === 0) throw new Error("Dữ liệu đặt vé không hợp lệ.");

                // Thực hiện booking lần lượt cho từng hạng vé
                let lastData = null;
                let totalTicketsBought = 0;

                for (let i = 0; i < bookingList.length; i++) {
                    const item = bookingList[i];
                    const hId = parseInt(item.id);
                    
                    if (isNaN(hId)) {
                        console.error("Invalid Tier ID for item:", item);
                        throw new Error("Không xác định được Hạng vé. Vui lòng chọn lại.");
                    }

                    console.log("Submitting booking for tier:", hId, "Qty:", item.qty);
                    
                    const walletPassword = document.getElementById('walletPasswordInput') ? document.getElementById('walletPasswordInput').value : '';

                    const response = await fetch('http://localhost:8081/api/booking/create', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                        body: JSON.stringify({ 
                            maSuKien: parseInt(eventId), 
                            maLichDien: parseInt(validMaLichDien),
                            maHangVe: hId, 
                            maKhuVuc: item.maKhuVuc ? parseInt(item.maKhuVuc) : null,
                            soLuong: item.qty,
                            dsGhe: item.seats,
                            discountCode: (appliedDiscount && appliedDiscount.code) || null,
                            paymentMethod: paymentMethod,
                            walletPassword: walletPassword
                        })
                    });

                    let data;
                    const responseText = await response.text();
                    try {
                        data = JSON.parse(responseText);
                    } catch (e) {
                        console.error("Server response was not JSON:", responseText);
                        throw new Error("Lỗi hệ thống (Server Error). Vui lòng thử lại sau.");
                    }

                    if(!response.ok) {
                        throw new Error(data.message || 'Lỗi khi đặt vé hạng ' + item.id);
                    }
                    
                    lastData = data;
                    totalTicketsBought += (data.totalTickets || item.qty);
                }

                if (lastData) {
                    window.location.href = `checkout.html?invoiceId=${lastData.invoiceId}&tickets=${totalTicketsBought}`;
                }
            } catch(err) {
                alert("❌ Thất bại: " + err.message);
                btn.innerHTML = 'XÁC NHẬN ĐẶT VÉ <i class="fa fa-chevron-right"></i>';
                btn.disabled = false;
            }
        }

        // Khởi tạo
        if(eventId) initData();
    </script>
</body>
</html>
