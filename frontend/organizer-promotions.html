<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ve'ryGood | Quản Lý Khuyến Mãi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="assets/test.png">
    <style>
        .promotion-card {
            background: var(--card-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            backdrop-filter: blur(10px);
        }
        .promotion-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 0.8rem;
        }
        .code-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 15px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }
        .code-text {
            font-family: 'Unbounded', sans-serif;
            color: var(--accent-secondary);
            font-weight: 700;
        }
        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .form-group label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .form-group input, .form-group select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            padding: 10px;
            border-radius: 8px;
            color: #fff;
        }
        .status-pill {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .status-ongoing { background: rgba(0, 255, 136, 0.1); color: #00ff88; }
        .status-upcoming { background: rgba(0, 229, 255, 0.1); color: #00e5ff; }
        .status-ended { background: rgba(255, 255, 255, 0.1); color: var(--text-muted); }

        /* Modal Styles */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-content {
            background: #10101a;
            border: 1px solid var(--accent-secondary);
            border-radius: 24px;
            padding: 2rem;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 0 50px rgba(0, 229, 255, 0.2);
            animation: modalScale 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes modalScale {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 1rem;
        }
        .form-group input, .form-group select {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-subtle);
            padding: 12px 16px;
            border-radius: 12px;
            color: #fff;
            transition: all 0.3s;
            font-family: 'Be Vietnam Pro', sans-serif;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: var(--accent-secondary);
            background: rgba(255, 255, 255, 0.08);
            outline: none;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.1);
        }
        .btn-full {
            width: 100%;
            padding: 1rem;
            margin-top: 1.5rem;
            font-size: 1rem;
            border-radius: 12px;
        }
    </style>
</head>

<body>
    <div class="bg-mesh primary-mesh"></div>
    <div class="bg-mesh secondary-mesh"></div>
    
    <header class="navbar">
        <a href="index.html" style="text-decoration:none; color:inherit;">
            <div class="logo">Ve'ry<span class="neon-text">Good</span></div>
        </a>
        <div class="nav-center">
            <div class="search-bar">
                <i class="fa fa-search"></i>
                <input type="text" placeholder="Tìm kiếm sự kiện..." id="searchInput">
            </div>
        </div>
        <div class="nav-links">
            <a href="index.html" class="nav-btn">Trang Chủ</a>
            <a href="admin-approval.html" style="display:none;" id="adminNav" class="nav-btn">Duyệt Sự Kiện</a>
            <a href="event-management.html" style="display:none;" id="revenueNav" class="nav-btn">Quản Lý Sự Kiện</a>
            <a href="organizer-promotions.html" style="display:none;" id="promotionsNav" class="nav-btn active">Khuyến Mãi</a>
            <a href="admin-create.html" style="display:none;" id="createEventNav" class="nav-btn">Tạo Sự Kiện</a>

            <div class="account-dropdown" id="accountDropdown" style="display:none;">
                <button class="btn btn-account">
                    <i class="fa fa-user-circle"></i>
                    <span id="userNameDropdown">Tài khoản</span>
                    <i class="fa fa-chevron-down" style="font-size: 0.7rem; margin-left: 5px; opacity: 0.7;"></i>
                </button>
                <div class="dropdown-content">
                    <a href="profile.html"><i class="fa fa-user"></i> Hồ sơ của tôi</a>
                    <div class="dropdown-divider"></div>
                    <a href="#" onclick="logout(); return false;" class="logout-item"><i class="fa fa-sign-out-alt"></i> Đăng xuất</a>
                </div>
            </div>
        </div>
    </header>

    <main class="container" style="padding-top: 2rem;">
        <div class="admin-page-header fade-up" style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h1 class="neon-text" style="font-size: 1.8rem; font-family: 'Unbounded'; margin: 0;">KHUYẾN MÃI</h1>
                <p style="color: var(--text-muted); font-size: 0.9rem;">Quản lý chiến dịch và mã giảm giá cho sự kiện của bạn</p>
            </div>
            <button class="btn btn-primary" onclick="openCampaignModal()"><i class="fa fa-plus"></i> Tạo Chiến Dịch</button>
        </div>

        <div id="promotionList">
            <div class="empty-state">Đang tải danh sách khuyến mãi...</div>
        </div>
    </main>

    <!-- Modal Tạo Chiến Dịch -->
    <div id="campaignModal" class="modal" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 style="font-family: 'Unbounded'; color: var(--accent-secondary); margin: 0; font-size: 1.4rem;">TẠO CHIẾN DỊCH</h2>
                <span onclick="closeCampaignModal()" style="cursor:pointer; font-size: 1.8rem; color: var(--text-muted); transition: 0.3s;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='var(--text-muted)'">&times;</span>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label><i class="fa fa-calendar-star" style="margin-right: 5px;"></i> Sự kiện áp dụng</label>
                    <select id="eventSelect"></select>
                </div>
                <div class="form-group">
                    <label><i class="fa fa-tag" style="margin-right: 5px;"></i> Tên chiến dịch</label>
                    <input type="text" id="campaignName" placeholder="Ví dụ: Ưu đãi mùa hè 2024">
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <label><i class="fa fa-clock" style="margin-right: 5px;"></i> Ngày bắt đầu</label>
                        <input type="text" id="campaignStart" class="dt-picker" placeholder="Chọn ngày bắt đầu">
                    </div>
                    <div class="form-group">
                        <label><i class="fa fa-hourglass-end" style="margin-right: 5px;"></i> Ngày kết thúc</label>
                        <input type="text" id="campaignEnd" class="dt-picker" placeholder="Chọn ngày kết thúc">
                    </div>
                </div>
                <button class="btn btn-primary btn-full" onclick="saveCampaign()">LƯU CHIẾN DỊCH</button>
            </div>
        </div>
    </div>

    <!-- Modal Tạo Mã Giảm Giá -->
    <div id="codeModal" class="modal" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2 style="font-family: 'Unbounded'; color: var(--accent-secondary); margin: 0; font-size: 1.4rem;">TẠO MÃ GIẢM GIÁ</h2>
                <span onclick="closeCodeModal()" style="cursor:pointer; font-size: 1.8rem; color: var(--text-muted); transition: 0.3s;" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='var(--text-muted)'">&times;</span>
            </div>
            <div class="modal-body">
                <input type="hidden" id="currentCampaignId">
                <div class="form-group">
                    <label><i class="fa fa-ticket" style="margin-right: 5px;"></i> Mã (Code)</label>
                    <input type="text" id="discountCode" placeholder="Ví dụ: SUMMER2024">
                </div>
                <div class="form-group">
                    <label><i class="fa fa-list" style="margin-right: 5px;"></i> Loại giảm giá</label>
                    <select id="discountType">
                        <option value="Theo phần trăm">Theo phần trăm (%)</option>
                        <option value="Số tiền cố định">Số tiền cố định (VNĐ)</option>
                    </select>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div class="form-group">
                        <label><i class="fa fa-coins" style="margin-right: 5px;"></i> Giá trị giảm</label>
                        <input type="number" id="discountValue">
                    </div>
                    <div class="form-group">
                        <label><i class="fa fa-shield-halved" style="margin-right: 5px;"></i> Giảm tối đa (VNĐ)</label>
                        <input type="number" id="maxDiscount" value="0">
                    </div>
                </div>
                <div class="form-group">
                    <label><i class="fa fa-users" style="margin-right: 5px;"></i> Lượt sử dụng tối đa</label>
                    <input type="number" id="maxUsage">
                </div>
                <button class="btn btn-primary btn-full" onclick="saveCode()">TẠO MÃ NGAY</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="js/script.js"></script>
    <script src="js/organizer-promotions.js"></script>
</body>
</html>
